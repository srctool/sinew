# Dependabot keeps the submodule pointers and the workflow actions up to date by opening PRs.
version: 2
updates:
  # kotlin-lib and dart-lib: follow the branch in .gitmodules (main). One PR for both.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    groups:
      libraries:
        patterns: ['*']
    commit-message:
      prefix: chore(submodules)
    # Dependabot waits 3 days before offering a new version by default. These are our own
    # libraries, so take their merged main right away.
    cooldown:
      default-days: 1
      exclude: ['*']

  # GitHub Actions used by .github/workflows (keeps Dependabot's default 3-day cooldown).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)

  # The two Docusaurus sites. Only security updates (no routine version bumps), and all of
  # them in one PR instead of one PR per vulnerable package.
  - package-ecosystem: npm
    directories: ['/docs/internal', '/docs/usage']
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      docs-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: chore(docs)
