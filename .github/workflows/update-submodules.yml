name: Update submodules

# Run by hand from the Actions tab: Run workflow → target (develop or main).
# Moves kotlin-lib and dart-lib to the latest commit of the same branch in their repositories
# (develop → develop, main → main) and opens a pull request into the target with the change,
# or updates the one already open. Merge it after the library pull requests it should include.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to update; submodules follow the branch of the same name in their repositories'
        required: true
        type: choice
        options: [develop, main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-submodules-${{ inputs.target }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target }}
  BRANCH: chore/update-submodules-${{ inputs.target }}

jobs:
  update-submodules:
    name: Update submodules on ${{ inputs.target }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ${{ inputs.target }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .gitmodules uses SSH URLs; the runner has no SSH key, so fetch the (public) submodules over HTTPS.
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Move submodules to the latest ${{ inputs.target }}
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          for sub in $(git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            before="$(git -C "$sub" rev-parse --short HEAD)"
            git -C "$sub" fetch -q origin "$TARGET"
            latest="$(git -C "$sub" rev-parse --short FETCH_HEAD)"
            # Only move forward: never point at a commit older than the current one.
            if [[ "$latest" != "$before" ]] && git -C "$sub" merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "::warning::$sub: $TARGET ($latest) is behind the current pointer ($before). Keeping $before; merge the library's newer work into its $TARGET first."
              continue
            fi
            git -C "$sub" checkout -q --detach FETCH_HEAD
            echo "$sub: $before → $latest"
          done

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain -- $(git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}'))" ]]; then
            echo "No submodule moved forward from $TARGET. Nothing to do."
            exit 0
          fi
          summary=""
          for sub in $(git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            git add "$sub"
            summary+="- \`$sub\` → $(git -C "$sub" rev-parse --short HEAD) ($(git -C "$sub" log -1 --format=%s))"$'\n'
          done
          git switch -c "$BRANCH"
          git commit -m "chore(submodules): update submodules to the latest $TARGET" -m "$summary"
          git push --force origin "$BRANCH"
          body="$(printf 'Moves the submodules to the latest `%s` of their repositories:\n\n%s\nOpened by the Update submodules workflow.' "$TARGET" "$summary")"
          if [[ -n "$(gh pr list --head "$BRANCH" --base "$TARGET" --state open --json number --jq '.[].number')" ]]; then
            echo "Updated the open pull request from $BRANCH."
          else
            gh pr create --base "$TARGET" --head "$BRANCH" \
              --title "chore(submodules): update submodules to the latest $TARGET" --body "$body"
          fi
