name: Docs

# Two Docusaurus sites, each deployed to its own Cloudflare Pages project:
#   docs/internal → sinew-dev.srctool.com (contributor docs)
#   docs/usage    → sinew.srctool.com     (usage docs)
# Pull requests only build; pushes to main that change docs/ deploy.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # Every PR builds both sites, so the required "internal docs" / "usage docs" checks always report
  # (a path filter would leave PRs that don't touch docs/ waiting forever on a required check).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  SINEW_INTERNAL_URL: https://sinew-dev.srctool.com
  SINEW_USAGE_URL: https://sinew.srctool.com

jobs:
  docs:
    name: ${{ matrix.site }} docs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: internal
            project: sinew-dev
          - site: usage
            project: sinew
    defaults:
      run:
        working-directory: docs/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/${{ matrix.site }}/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        # Only the organization repo deploys; forks and pull requests have no Cloudflare secrets.
        if: github.repository == 'srctool/sinew' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/${{ matrix.site }}
          command: pages deploy build --project-name=${{ matrix.project }} --branch=main --commit-dirty=true
